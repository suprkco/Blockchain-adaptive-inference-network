name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        with:
          name: local-inference-receipts
          path: evaluation/demo.json
  trained-model:
    runs-on: ubuntu-latest
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
      BENCH_REPEATS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-benchmark.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: minilm-1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-benchmark.txt
      - run: npm ci --ignore-scripts
      - run: python -m pytest tests/test_embedding.py -q
      - run: npm run benchmark
      - run: python -m benchmark.failures
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model-smoke-results
          path: |
            evaluation/embedding-benchmark.json
            evaluation/failures.json
